<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171e35">
  <meta name="description" content="Interface de login responsiva desenvolvida com HTML, CSS e JavaScript.">
  <title>Portal | Acesso</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/media-query.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="login" aria-label="Acesso à conta">
      <aside class="showcase" aria-label="Apresentação">
        <div class="showcase__top">
          <a class="brand" href="index.html" aria-label="Portal - início">
            <span class="brand__symbol" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
            <span>portal<span class="brand__dot">.</span></span>
          </a>
          <span class="showcase__tag">Seu espaço digital</span>
        </div>
        <div class="showcase__art" aria-hidden="true">
          <div class="orbit orbit--outer"></div>
          <div class="orbit orbit--inner"></div>
          <div class="orb orb--one"></div>
          <div class="orb orb--two"></div>
          <div class="glass-tile">
            <span class="tile-spark"></span>
            <span class="tile-bar tile-bar--one"></span>
            <span class="tile-bar tile-bar--two"></span>
            <span class="tile-bar tile-bar--three"></span>
          </div>
        </div>
        <div class="showcase__message">
          <span class="eyebrow">ORGANIZE · CONECTE · EVOLUA</span>
          <h2>Seu próximo passo começa aqui.</h2>
          <p>Uma experiência simples, fluida e pensada para qualquer tela.</p>
        </div>
      </aside>

      <div class="login__content">
        <div class="mobile-brand" aria-hidden="true">
          <span class="brand__symbol"><span></span><span></span><span></span><span></span></span>
          <span>portal<span class="brand__dot">.</span></span>
        </div>
        <div class="login__intro">
          <span class="section-label">ÁREA DE ACESSO</span>
          <h1>Bem-vindo de volta<span class="accent">.</span></h1>
          <p>Entre com seu e-mail e senha para continuar.</p>
        </div>
        <form id="loginForm" class="login__form" autocomplete="on">
          <div class="field">
            <label for="email">E-mail</label>
            <div class="field__control">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com" maxlength="80" required>
            </div>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <div class="field__control">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" maxlength="64" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="submit" type="submit">
            <span>Entrar</span>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
          <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
        </form>
        <p class="login__footnote">Desenvolvido por <a href="https://github.com/devaxl64" target="_blank" rel="noopener noreferrer">devaxl64</a></p>
      </div>
    </section>
  </main>
</body>
</html>
